<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Selección de Asientos General - La Velada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="asientos-body">
    <header class="navbar">
        <div class="nav-logo">LA VELADA</div>
        <nav class="nav-menu">
            <a href="index.html">Inicio</a>
            <a href="combates.html">Combates</a>
            <a href="boxeadores.html">Boxeadores</a>
            <a href="entradas.html">Entradas</a>
            <a href="Preguntas.html">FAQ</a>
        </nav>
    </header>

    <div class="booking-container">
        <h2>Selección de Asientos (General)</h2>
        <div class="info-resumen">
            <p>Nº de entradas a seleccionar: <strong id="cantidad-entradas-mapa">0</strong></p>
        </div>

        <div class="interactive-map-container">
            <p id="instrucciones-asientos" class="mensaje-info">Cargando asientos...</p>
            <div class="stadium-layout">
                <!-- Las filas donde se dibujan los botones de asientos -->
                <div class="seat-row" id="row-alta"></div>
                <div class="seat-row" id="row-media"></div>
                <div class="seat-row" id="row-baja"></div>
                <div class="seat-row" id="row-pista"></div>
                <div class="boxing-ring">
                    <span>RING LA VELADA</span>
                </div>
            </div>
        </div>

        <!-- Botón correcto de confirmación para el formulario -->
        <button id="btn-confirmar" class="buy-btn" disabled onclick="finalizarReserva()">Confirmar Reserva</button>
    </div>

    <!-- Script principal al final del cuerpo -->
    <script src="script.js"></script>
</body>
</html>
