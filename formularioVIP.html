<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Selección de Asientos VIP - La Velada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="asientos-body">
    <header class="navbar">

        <div class="nav-logo">LA VELADA</div>
        <nav class="nav-menu">
            <a href="index.html">Inicio</a>
            <a href="combates.html">Combates</a>
            <a href="boxeadores.html">Boxeadores</a>
            <a href="entradas.html">Entradas</a>
            <a href="Preguntas.html">FAQ</a>
        </nav>
        </div>
    </header>
    <div class="booking-container">
        <h2>Selección de Asientos VIP</h2>
        <div class="info-resumen">
            <p>Nº de entradas VIP a seleccionar: <strong id="cantidad-entradas-mapa">0</strong></p>
        </div>

        <div class="interactive-map-container">
            <p id="instrucciones-asientos" class="mensaje-info">Cargando asientos exclusivos...</p>
            <div class="stadium-layout">
                <!-- Solo dejamos las filas VIP -->
                 <div class="seat-row" id="row-alta"></div>
                 <div class="seat-row" id="row-media"></div>
                <div class="seat-row" id="row-baja"></div>
                <div class="seat-row" id="row-pista"></div>
                <div class="boxing-ring">
                    <span>RING LA VELADA</span>
                </div>
            </div>
        </div>
        
        <!-- Aquí está el cambio clave: ahora el botón procesa la compra VIP -->
        <button id="btn-confirmar" class="buy-btn" disabled onclick="finalizarReserva()">Confirmar Reserva</button>
    </div>

<!-- Asegúrate de cargar script.js justo aquí abajo -->
